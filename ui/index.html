<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crosstalk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='11' cy='16' r='8' fill='%23D97757'/%3E%3Ccircle cx='21' cy='16' r='8' fill='%234C8DF6' fill-opacity='.85'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --line: #e6e5e1; --text: #1d1d1b; --muted: #74726c;
  --claude: #d97757; --antigravity: #4c8df6; --user: #5b5a55; --busy: #e0a100; --ok: #2e9e5b; --waiting: #8b6cf6;
  --bubble: #ffffff; --mine: #1d1d1b; --mine-text: #fafaf8; --error: #c4372c;
  --font: ui-sans-serif, -apple-system, "SF Pro Text", "Inter", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141413; --panel: #1c1c1a; --line: #2c2b28; --text: #ecebe7; --muted: #9a988f;
    --bubble: #222220; --mine: #ecebe7; --mine-text: #141413; --user: #b8b6ae;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); display: grid; grid-template-columns: 280px minmax(0, 1fr); }
aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.brand { display: flex; align-items: center; gap: 10px; padding: 16px; font-weight: 600; font-size: 15px; letter-spacing: -.01em; }
.brand svg { flex: none; }
.agents { overflow-y: auto; padding: 0 8px 16px; flex: 1; }
.group { margin-top: 14px; }
.group h2 { display: flex; align-items: center; gap: 8px; margin: 0 8px 6px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.group h2 .dot { width: 8px; height: 8px; border-radius: 50%; }
.group .note { margin: 0 8px; font-size: 12px; color: var(--muted); }
.group .note code { font-family: var(--mono); font-size: 11px; }
.project { margin: 8px 8px 2px; font-size: 11px; color: var(--muted); }
button.agent { all: unset; box-sizing: border-box; width: 100%; display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 8px; cursor: pointer; }
button.agent:hover { background: var(--bg); }
button.agent[aria-pressed="true"] { background: var(--bg); box-shadow: inset 0 0 0 1px var(--line); }
button.agent:focus-visible { outline: 2px solid var(--antigravity); }
.agent .text { flex: 1; min-width: 0; display: grid; }
.agent .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.agent .note { font-size: 12px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.agent .state { width: 7px; height: 7px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--muted); flex: none; opacity: .6; }
.agent .state.busy, .agent .state.idle, .agent .state.waiting, .agent .state.open { opacity: 1; box-shadow: none; }
.agent .state.busy { background: var(--busy); animation: pulse 1.4s ease-in-out infinite; }
.agent .state.idle { background: var(--ok); }
.agent .state.open { box-shadow: inset 0 0 0 2px var(--antigravity); }
.agent .state.waiting { background: var(--waiting); box-shadow: 0 0 0 3px color-mix(in srgb, var(--waiting) 25%, transparent); }
button.agent { align-items: flex-start; }
.agent .state { margin-top: 7px; }
@keyframes pulse { 50% { opacity: .35; } }
main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
#timeline { flex: 1; overflow-y: auto; padding: 24px clamp(16px, 4vw, 48px); display: flex; flex-direction: column; gap: 14px; }
.empty { margin: auto; max-width: 420px; text-align: center; color: var(--muted); }
.empty svg { margin-bottom: 12px; }
.empty b { color: var(--text); font-weight: 600; }
.msg { display: flex; gap: 10px; max-width: 760px; }
.msg.fresh { animation: rise .25s ease-out; }
.msg.mine { align-self: flex-end; flex-direction: row-reverse; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
.avatar { width: 28px; height: 28px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 600; }
.meta { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-bottom: 4px; flex-wrap: wrap; }
.msg.mine .meta { justify-content: flex-end; }
.meta .who, .meta .to-name { max-width: 28ch; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta .who { color: var(--text); font-weight: 600; }
.meta time { opacity: .8; }
.meta svg { opacity: .6; }
.bubble { background: var(--bubble); border: 1px solid var(--line); border-radius: 14px; padding: 9px 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.mine .bubble { background: var(--mine); color: var(--mine-text); border-color: transparent; }
form { border-top: 1px solid var(--line); background: var(--panel); padding: 12px clamp(16px, 4vw, 48px) 16px; display: grid; gap: 8px; }
.to { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); min-width: 0; }
.to select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; min-width: 0; max-width: 100%; }
.row { display: flex; gap: 8px; align-items: flex-end; }
textarea { flex: 1; min-width: 0; resize: none; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-height: 44px; max-height: 200px; }
textarea:focus, .to select:focus { outline: 2px solid var(--antigravity); outline-offset: -1px; }
button.send { font: inherit; font-weight: 600; border: 0; border-radius: 12px; height: 44px; padding: 0 18px; background: var(--text); color: var(--bg); cursor: pointer; }
button.send:disabled { opacity: .4; cursor: default; }
.status { font-size: 12px; min-height: 18px; color: var(--muted); }
.status.error { color: var(--error); }
@media (max-width: 720px) {
  body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  aside { border-right: 0; border-bottom: 1px solid var(--line); }
  .agents { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<aside>
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true"><circle cx="11" cy="16" r="8" fill="var(--claude)"/><circle cx="21" cy="16" r="8" fill="var(--antigravity)" fill-opacity=".85"/></svg>
    crosstalk
  </div>
  <div class="agents" id="agents" aria-label="Agents"></div>
</aside>
<main>
  <div id="timeline" role="log" aria-live="off" aria-label="Messages"></div>
  <form id="composer">
    <label class="to">To <select id="to"></select></label>
    <div class="row">
      <textarea id="text" rows="1" placeholder="Message" aria-label="Message"></textarea>
      <button class="send" id="sendBtn" type="submit">Send</button>
    </div>
    <div class="status" id="status" role="status"></div>
  </form>
</main>
<script>
const TOKEN = location.hash.slice(1);
const COLOR = { claude: 'var(--claude)', antigravity: 'var(--antigravity)', user: 'var(--user)' };
const LABEL = { claude: 'Claude', antigravity: 'Antigravity', codex: 'Codex', terminal: 'Terminal', user: 'You' };
const STATE = { idle: 'Ready', busy: 'Working', waiting: 'Waiting for you', open: 'Open in Antigravity' };
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };
let agentsJson = '';
let lastSender = null;
let touched = false; // the person picked a recipient; stop choosing one for them
let live = false; // false while the backlog streams in

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { 'x-crosstalk-token': TOKEN, 'content-type': 'application/json' } });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

const avatar = (agent) => el('div', { className: 'avatar', textContent: (LABEL[agent] || '?')[0], title: LABEL[agent] || agent, style: `background:${COLOR[agent] || 'var(--user)'}` });
const arrow = () => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('width', 12); s.setAttribute('height', 12); s.setAttribute('viewBox', '0 0 12 12'); s.setAttribute('aria-label', 'to'); s.innerHTML = '<path d="M2 6h8M7 3l3 3-3 3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>'; return s; };
const short = (p) => (p.agent === 'user' ? 'You' : p.name || LABEL[p.agent] || p.agent);

function addMessage(m) {
  $('timeline').querySelector('.empty')?.remove();
  const mine = m.from?.agent === 'user';
  if (!mine && ['claude', 'antigravity'].includes(m.from?.agent)) {
    lastSender = m.from;
    const key = senderKey(lastSender);
    if (!touched && [...$('to').options].some((o) => o.value === key)) { $('to').value = key; markSelected(); }
  }
  const d = new Date(m.ts);
  const meta = el('div', { className: 'meta' },
    el('span', { className: 'who', textContent: short(m.from || {}), title: `${LABEL[m.from?.agent] || ''} ${m.from?.name || ''}` }), arrow(),
    el('span', { className: 'to-name', textContent: short(m.to || {}), title: `${LABEL[m.to?.agent] || ''} ${m.to?.name || ''}` }),
    el('time', { dateTime: m.ts, textContent: d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) }));
  const node = el('div', { className: 'msg' + (mine ? ' mine' : '') + (live ? ' fresh' : '') }, avatar(m.from?.agent), el('div', {}, meta, el('div', { className: 'bubble', textContent: m.text })));
  const t = $('timeline');
  const atBottom = t.scrollHeight - t.scrollTop - t.clientHeight < 80;
  t.append(node);
  if (atBottom || mine) node.scrollIntoView({ block: 'end' });
}

function empty() {
  const box = el('div', { className: 'empty', innerHTML: '<svg width="56" height="32" viewBox="0 0 56 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="var(--claude)"/><circle cx="40" cy="16" r="14" fill="var(--antigravity)" fill-opacity=".85"/></svg>' });
  box.append(el('p', {}, 'No messages yet. Tell any agent something like', el('br'), el('b', { textContent: '"ask Antigravity to review this diff"' }), el('br'), 'and the conversation shows up here.'));
  $('timeline').replaceChildren(box);
}

function note(text, cmd) {
  const p = el('p', { className: 'note', textContent: text });
  if (cmd) p.append(' ', el('code', { textContent: cmd }));
  return p;
}

function renderAgents(agents) {
  const json = JSON.stringify(agents);
  if (json === agentsJson) return; // unchanged: keep focus and selection
  agentsJson = json;
  const targets = [];
  const groups = ['claude', 'antigravity'].map((agent) => {
    const rows = agents[agent];
    const g = el('div', { className: 'group' }, el('h2', {}, el('span', { className: 'dot', style: `background:${COLOR[agent]}` }), LABEL[agent]));
    if (!rows || rows.error) g.append(agent === 'antigravity' ? note('Not reachable. Run', 'crosstalk open antigravity') : note(rows?.error || 'Not available'));
    else if (!rows.length) g.append(note('None open'));
    else {
      if (agent === 'antigravity') targets.push({ key: 'antigravity|new', label: 'Antigravity · new conversation' });
      let project = null;
      for (const r of rows) {
        if (r.project && r.project !== project) g.append(el('div', { className: 'project', textContent: (project = r.project) }));
        const key = `${agent}|${agent === 'claude' ? r.name : r.id}`;
        const state = r.status || (r.open ? 'open' : '');
        targets.push({ key, label: `${LABEL[agent]} · ${r.name}`, state });
        const b = el('button', { className: 'agent', type: 'button', title: r.cwd || r.project || '', ariaLabel: `${LABEL[agent]}: ${r.name}${STATE[state] ? ', ' + STATE[state] : ''}` },
          el('span', { className: 'state ' + state, title: STATE[state] || 'State unknown' }),
          el('span', { className: 'text' }, el('span', { className: 'name', textContent: r.name }), ...(r.note ? [el('span', { className: 'note', textContent: r.note })] : [])));
        b.dataset.key = key;
        b.onclick = () => { touched = true; $('to').value = key; markSelected(); $('text').focus(); };
        g.append(b);
      }
    }
    return g;
  });
  $('agents').replaceChildren(...groups);
  const keep = $('to').value;
  $('to').replaceChildren(...targets.map((t) => el('option', { value: t.key, textContent: t.label + (t.state === 'waiting' ? ' (waiting for you)' : '') })));
  const last = lastSender && senderKey(lastSender);
  const has = (k) => k && targets.some((t) => t.key === k);
  $('to').value = has(keep) ? keep : has(last) ? last : (targets.find((t) => t.state === 'idle') || targets[0])?.key || '';
  markSelected();
}

function markSelected() {
  document.querySelectorAll('button.agent').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.key === $('to').value)));
}

function setStatus(text, error = false) {
  $('status').textContent = text;
  $('status').className = 'status' + (error ? ' error' : '');
}

async function refresh() {
  try {
    renderAgents((await api('/api/state')).agents);
  } catch (e) {
    setStatus(e.message, true);
  }
}

const senderKey = (p) => `${p.agent}|${p.agent === 'claude' ? p.name : p.id || 'current'}`;
$('to').onchange = () => { touched = true; markSelected(); };
$('text').addEventListener('input', (e) => { e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px'; });
$('text').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('composer').requestSubmit(); } });
$('composer').onsubmit = async (e) => {
  e.preventDefault();
  const text = $('text').value.trim();
  const [agent, ...rest] = $('to').value.split('|');
  if (!text || !agent) return;
  $('sendBtn').disabled = true;
  setStatus(agent === 'claude' ? 'Sending… (Claude takes about 10 s)' : 'Sending…');
  try {
    await api('/api/send', { method: 'POST', body: JSON.stringify({ agent, target: rest.join('|'), text }) });
    if ($('text').value.trim() === text) { $('text').value = ''; $('text').style.height = 'auto'; } // keep anything typed meanwhile
    setStatus('');
  } catch (err) {
    setStatus(err.message, true);
  } finally {
    $('sendBtn').disabled = false;
  }
};

if (!TOKEN) {
  setStatus('Open the link that `crosstalk ui` printed (it ends with #…).', true);
  $('sendBtn').disabled = true;
} else {
  empty();
  refresh();
  setInterval(refresh, 10000);
  const ev = new EventSource('/events?token=' + encodeURIComponent(TOKEN));
  ev.onmessage = (e) => addMessage(JSON.parse(e.data));
  ev.onopen = () => setTimeout(() => { live = true; $('timeline').setAttribute('aria-live', 'polite'); }, 1000); // animate and announce only new messages
  ev.onerror = () => refresh();
}
</script>
</body>
</html>
